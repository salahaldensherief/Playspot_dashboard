name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce canonical Supabase migration repository
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          sql_files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'supabase/*.sql')
          if [ -n "$sql_files" ]; then
            echo "Dashboard SQL files are legacy reference only."
            echo "Create production migrations in the playspot_V2 repository under supabase/migrations/."
            echo "$sql_files"
            exit 1
          fi

      - name: Check formatting of changed Dart files
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.dart')
          if [ -n "$files" ]; then
            dart format $files
            if ! git diff --exit-code -- $files; then
              echo "Changed Dart files are not formatted."
              exit 1
            fi
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Edge authorization and partial failure contracts
        run: node --test supabase/functions/*/*.test.mjs

      - name: Verify release build
        run: flutter build web --release
