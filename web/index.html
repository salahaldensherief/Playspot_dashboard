<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlaySpot Dashboard - Book, Play & Win">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PlaySpot Dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PlaySpot Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Business Fonts: Cairo for Arabic, Inter for English | Branding: Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0A0A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: white;
      font-family: 'Inter', 'Cairo', sans-serif;
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: elastic-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .app-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.4));
      margin-bottom: 16px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
    }

    .tagline {
      margin-top: 10px;
      font-size: 16px;
      color: #00D9FF;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
      opacity: 0;
      animation: fade-in 0.8s ease-in forwards;
      animation-delay: 0.3s;
      font-weight: 500;
    }

    .spinner {
      margin-top: 28px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 217, 255, 0.2);
      border-top: 3px solid #00D9FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes elastic-scale {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img class="app-logo" src="favicon.png" alt="PlaySpot Logo" />
    <div class="brand-title">PlaySpot</div>
    <div class="tagline">Dashboard Platform</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
