<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlaySpot Dashboard - Book, Play & Win">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PlaySpot Dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PlaySpot Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Business Fonts: Cairo for Arabic, Inter for English | Branding: Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0A0A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: white;
      font-family: 'Inter', 'Cairo', sans-serif;
    }

    #splash {
      display: flex;
      justify-content: center;
      align-items: center;
      animation: elastic-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .logo-container {
      padding: 16px 20px;
      border: 2.5px solid #00D9FF;
      border-radius: 24px;
      background-color: #000000;
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-logo {
      width: 240px;
      height: 150px;
      object-fit: contain;
    }

    @keyframes elastic-scale {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-container">
      <img class="app-logo" src="favicon.png" alt="PlaySpot Logo" />
    </div>
  </div>

  <script>
    window.removeSplash = function() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.transition = 'opacity 0.4s ease';
        splash.style.opacity = '0';
        setTimeout(() => {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
