<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlaySpot Dashboard - Book, Play & Win">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PlaySpot Dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PlaySpot Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Business Fonts: Cairo for Arabic, Inter for English | Branding: Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0A0A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: white;
      font-family: 'Inter', 'Cairo', sans-serif;
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: elastic-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      direction: ltr;
    }

    .logo-text {
      font-size: 50px;
      font-weight: 700;
      color: white;
      letter-spacing: -1px;
    }

    .joystick-icon {
      width: 40px;
      height: 40px;
      background-color: #00D9FF;
      -webkit-mask-image: url('joystik.svg');
      mask-image: url('joystik.svg');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      animation: wobble 0.6s ease-in-out infinite;
      animation-delay: 0.8s;
    }

    .tagline {
      margin-top: 16px;
      font-size: 18px;
      color: #00D9FF;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
      opacity: 0;
      animation: fade-in 0.8s ease-in forwards;
      animation-delay: 0.3s;
      font-weight: 400;
    }

    @keyframes elastic-scale {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(17deg); }
      45% { transform: rotate(-17deg); }
      75% { transform: rotate(17deg); }
      85% { transform: rotate(0deg); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-container">
      <span class="logo-text">PlaySp</span>
      <div class="joystick-icon"></div>
      <span class="logo-text">t</span>
    </div>
    <div class="tagline">Book, Play & Win</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
