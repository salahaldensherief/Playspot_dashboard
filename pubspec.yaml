name: play_spot_dashboard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Supabase
  supabase_flutter: ^2.12.4

  # Routing
  go_router: ^14.0.0

  # UI
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

  # Audio
  audioplayers: ^5.2.1

  # Charts
  fl_chart: ^0.68.0

  # Localization
  easy_localization: ^3.0.7

  # Caching
  shared_preferences: ^2.5.2

  # Utils
  dartz: ^0.10.1
  intl: ">=0.19.0 <1.0.0"
  uuid: ^4.5.3
  file_picker: ^8.1.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  intl: any

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/audio/
    - assets/images/
